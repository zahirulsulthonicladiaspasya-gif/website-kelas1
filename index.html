<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Resmi Kelas - Kenangan Kita</title>
  <meta name="description" content="Website resmi kelas: tentang, anggota, galeri, dan prestasi. Tempat menyimpan kenangan bersama.">
  <meta name="theme-color" content="#1a0e07">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="#home" id="brand"></a>
    <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false">☰</button>
    <nav id="menu" aria-label="Navigasi utama"></nav>
  </header>
  <main>
    <section id="home" class="hero"></section>
    <section id="tentang" class="sec"></section>
    <section id="media" class="sec"></section>
    <section id="struktur" class="sec"></section>
    <section id="anggota" class="sec"></section>
    <section id="gallery" class="sec"></section>
    <section id="prestasi" class="sec"></section>
    <section id="pesan" class="sec"></section>
  </main>
  <footer><p id="foot"></p></footer>
  <div id="lightbox" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
